[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "changepoint"
version = "0.4.0"
authors = [{ name = "Redpoll", email = "info@redpoll.ai" }]
description = "A Bayesian change point library"
readme = "README.md"
requires-python = ">=3.7, < 4"
keywords = ["changepoint"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Repository = "https://github.com/promised-ai/changepoint"

[tool.maturin]
bindings = "pyo3"

[tool.black]
line-length = 80
